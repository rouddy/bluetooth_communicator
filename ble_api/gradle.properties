org.gradle.jvmargs=-Xmx2G
# Plain Java, so apps that use it don't get a Kotlin dependency from it.
android.builtInKotlin=false

# The version (com.rouddy.bluetooth_communicator:ble-api), x.y.z. Its major is
# IBleCommunicator.API_VERSION. A tag bleApi/<x.y.z><suffix> with this x.y.z
# publishes it as <x.y.z><suffix> (README.md).
bleApi.version=2.0.1
# The oldest API_VERSION this one still works with, in either direction. Raise it
# only when a change breaks older apps or communicators.
bleApi.minCompatibleVersion=1
