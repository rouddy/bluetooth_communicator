# Builds ble-api (ble_api/README.md) on every change to it, and publishes it to
# GitHub Packages when a tag bleApi/<x.y.z><suffix> is pushed: x.y.z has to be
# bleApi.version, and everything after "bleApi/" is the published version
# (bleApi/2.0.0 publishes 2.0.0, bleApi/2.0.0-beta.1 publishes 2.0.0-beta.1).
name: ble-api

on:
  push:
    branches: [master, develop]
    # Path filters don't apply to tags: every bleApi/* tag runs.
    tags: ['bleApi/*']
    paths:
      - 'ble_api/**'
      - '.github/workflows/ble-api.yml'
  pull_request:
    paths:
      - 'ble_api/**'
      - '.github/workflows/ble-api.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ble_api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # checkBleApi fails if the AIDL changed under a frozen API_VERSION. A release
      # build would also need the version frozen; that's left to publishing, so a
      # branch can work on the next version.
      - name: Check, test, and build
        run: ./gradlew checkBleApi testDebugUnitTest assembleDebug

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/bleApi/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # The suffix may only use characters a Maven version can.
      - name: Check the tag against bleApi.version
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^bleApi/([0-9]+\.[0-9]+\.[0-9]+)([0-9A-Za-z._+-]*)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't bleApi/<x.y.z><suffix>"
            exit 1
          fi
          base=$(sed -n 's/^bleApi\.version=//p' gradle.properties)
          if [ "${BASH_REMATCH[1]}" != "$base" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match bleApi.version=$base in ble_api/gradle.properties"
            exit 1
          fi
          echo "publish=${GITHUB_REF_NAME#bleApi/}" >> "$GITHUB_OUTPUT"
      # The release build checks that API_VERSION is frozen (frozen-api.properties).
      # GitHub Packages refuses a version that was already published.
      - name: Publish ${{ steps.version.outputs.publish }} to GitHub Packages
        run: ./gradlew publishReleasePublicationToGitHubPackagesRepository "-PbleApi.publishVersion=$PUBLISH_VERSION"
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.publish }}
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
