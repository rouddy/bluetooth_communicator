# Builds ble-api (ble_api/README.md) on every change to it, and publishes it to
# GitHub Packages when a tag ble-api-v<bleApi.version> is pushed.
name: ble-api

on:
  push:
    branches: [master, develop]
    # Path filters don't apply to tags: every ble-api-v* tag runs.
    tags: ['ble-api-v*']
    paths:
      - 'ble_api/**'
      - '.github/workflows/ble-api.yml'
  pull_request:
    paths:
      - 'ble_api/**'
      - '.github/workflows/ble-api.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ble_api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # checkBleApi fails if the AIDL changed under a frozen API_VERSION. A release
      # build would also need the version frozen; that's left to publishing, so a
      # branch can work on the next version.
      - name: Check, test, and build
        run: ./gradlew checkBleApi testDebugUnitTest assembleDebug

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ble-api-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Check that the tag is bleApi.version
        run: |
          version=$(sed -n 's/^bleApi\.version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "ble-api-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match bleApi.version=$version in ble_api/gradle.properties"
            exit 1
          fi
      # The release build checks that API_VERSION is frozen (frozen-api.properties).
      # GitHub Packages refuses a version that was already published.
      - name: Publish to GitHub Packages
        run: ./gradlew publishReleasePublicationToGitHubPackagesRepository
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
